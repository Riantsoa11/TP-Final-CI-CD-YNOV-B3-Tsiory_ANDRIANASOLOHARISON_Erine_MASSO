name: CD

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate Compose config (staging)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config > /dev/null
          echo "Compose staging config valid"

      - name: Build images (staging)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.staging.yml build
          docker images

      - name: Smoke test staging
        run: bash scripts/smoke-test.sh
        env:
          SMOKE_HOST: localhost
          SMOKE_PORT: 8081

      - name: Log deployment
        run: |
          echo "DEPLOYED TO STAGING"
          echo "Version : ${{ github.sha }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Date    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Actor   : ${{ github.actor }}"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate Compose config (production)
        run: |
          docker compose config > /dev/null
          echo "Compose production config valid"

      - name: Build images (production)
        run: |
          docker compose build
          docker tag $(docker images -q shoplite-api 2>/dev/null || echo "shoplite-api") \
            shoplite-api:${{ github.ref_name }} 2>/dev/null || true
          docker images

      - name: Smoke test production
        run: bash scripts/smoke-test.sh
        env:
          SMOKE_HOST: localhost
          SMOKE_PORT: 8080

      - name: Log deployment
        run: |
          echo "DEPLOYED TO PRODUCTION"
          echo "Version : ${{ github.ref_name }}"
          echo "Tag     : ${{ github.ref }}"
          echo "Date    : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Actor   : ${{ github.actor }}"