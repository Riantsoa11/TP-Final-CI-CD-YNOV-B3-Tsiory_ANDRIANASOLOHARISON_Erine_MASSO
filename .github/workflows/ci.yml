name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shoplite_test
          POSTGRES_USER: shoplite
          POSTGRES_PASSWORD: shoplite_test_password
        options: >-
          --health-cmd "pg_isready -U shoplite -d shoplite_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: postgres://shoplite:shoplite_test_password@localhost:5432/shoplite_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Init database schema
        run: psql "$DATABASE_URL" -f ../database/init.sql

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 20
        with:
          name: coverage-report
          path: api/coverage/
          retention-days: 7

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t shoplite-api:${{ github.sha }} ./api

      - name: Build frontend image
        run: docker build -t shoplite-frontend:${{ github.sha }} ./frontend

      - name: Tag API image with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag shoplite-api:${{ github.sha }} shoplite-api:${{ github.ref_name }}

      - name: Check API image size
        run: |
          docker images shoplite-api
          SIZE=$(docker inspect shoplite-api:${{ github.sha }} --format='{{.Size}}')
          echo "Image size: $(echo $SIZE | awk '{printf "%.1f MB", $1/1024/1024}')"

      - name: Run npm audit
        working-directory: api
        run: npm audit --audit-level=high || true

      - name: Check outdated packages
        working-directory: api
        run: npm outdated || true
